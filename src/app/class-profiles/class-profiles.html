<p style="color:red; font-size: 24px;">TEMPLATE LOADED</p>


@if (profiles().length > 0) {
    <table>
        <thead>
            <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Gender</th>
            <th>Role</th>
            <th>School</th>
            <th>Class Cohort</th>
            <th>CCA</th>
            </tr>
        </thead>
        <tbody>
            @for (p of profiles(); track p.id) {
                <tr [routerLink]="['/chat', p.id]">
                    <td>{{ p.id }}</td>
                    <td>{{ p.name }}</td>
                    <td>{{ p.gender }}</td>
                    <td>{{ p.role }}</td>
                    <td>{{ p.school }}</td>
                    <td>{{ p.classCohort }}</td>
                    <td>{{ p.cca }}</td>
                </tr>
            }
        </tbody>
    </table>
} @else {
    <p>No profiles found</p>
}
