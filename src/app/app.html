<mat-toolbar class="topbar">
    @if (loginSvc.isLoggedIn()) {
        <button matIconButton type="button" (click)="drawer.toggle()" aria-label="Open or close menu">
            <mat-icon>menu</mat-icon>
        </button>
    }
    <a class="logo" routerLink="/class">
        <mat-icon>local_florist</mat-icon>
        <span>COACHat<span class="logo-lah">Lah</span></span>
    </a>

    <span class="spacer"></span>

    @if (loginSvc.isLoggedIn()) {
        <span class="user-name">
            <mat-icon>account_circle</mat-icon>
            {{ loginSvc.userName() ?? loginSvc.userId() }}
        </span>
        <button class="logout-btn" matButton="outlined" type="button" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span class="logout-label">Log out</span>
        </button>
    }
</mat-toolbar>
<div class="skyline" aria-hidden="true"></div>

<mat-sidenav-container class="shell">
    <mat-sidenav #drawer class="drawer"
        [mode]="isPhone() ? 'over' : 'side'"
        [opened]="loginSvc.isLoggedIn() && !isPhone()">
        <nav class="nav">
            <a class="nav-item" routerLink="/class" routerLinkActive="active"
               (click)="isPhone() && drawer.close()">
                <mat-icon>school</mat-icon>
                <span>My class</span>
            </a>
            <a class="nav-item" routerLink="/cca" routerLinkActive="active"
               (click)="isPhone() && drawer.close()">
                <mat-icon>sports_soccer</mat-icon>
                <span>My CCA</span>
            </a>
            <a class="nav-item" routerLink="/support" routerLinkActive="active"
               (click)="isPhone() && drawer.close()">
                <mat-icon>volunteer_activism</mat-icon>
                <span>Get support</span>
            </a>
            @if (loginSvc.canReview()) {
                <a class="nav-item" routerLink="/escalation" routerLinkActive="active"
                   (click)="isPhone() && drawer.close()">
                    <mat-icon>flag</mat-icon>
                    <span>Escalations</span>
                </a>
            }
        </nav>
    </mat-sidenav>

    <mat-sidenav-content>
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>
